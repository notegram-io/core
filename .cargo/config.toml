# Android loads shared libraries by mapping their LOAD segments directly, so a
# segment aligned to a smaller page than the device uses cannot be mapped and
# the platform falls back to a compatibility mode (or refuses the library).
# Devices with 16 KB pages are the direction the platform is moving in, and
# NDK r27 only aligns the 64-bit targets by default — say it explicitly for
# every target so a build from any machine produces loadable libraries.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
