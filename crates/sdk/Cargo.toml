[package]
name = "sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Notegram client SDK: composes identity, X3DH session establishment, the Double Ratchet, and the encrypted local store into one high-level client. The platform bindings (Kotlin/Swift via UniFFI) wrap this."

[lints]
workspace = true

[lib]

crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi"]

[features]
default = []

sqlite = ["store/sqlite"]

uniffi = [
    "dep:uniffi",
    "uniffi/cli",
    "uniffi/tokio",
    "sqlite",
    "dep:net",
    "dep:kt",
    "dep:tokio",
    "dep:rustls",
    "dep:tokio-rustls",
]

[dependencies]
crypto = { path = "../crypto" }
e2ee = { path = "../e2ee" }
ratchet = { path = "../ratchet" }
store = { path = "../store" }
net = { path = "../net", optional = true }
tl = { path = "../tl" }
wire = { path = "../wire" }
kt = { path = "../kt", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
uniffi = { version = "0.28", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
