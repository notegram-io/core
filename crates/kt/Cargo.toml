[package]
name = "kt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side key-transparency verification for Notegram: sparse Merkle tree (CONIKS) proof checking and signed tree roots."

[lints]
workspace = true

[dependencies]
crypto = { path = "../crypto" }
wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
base64 = "0.22"

[dev-dependencies]
e2ee = { path = "../e2ee" }
