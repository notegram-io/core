name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: core, fetch-depth: 1 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      # Parity vectors live in this repository and the tests below read them
      # directly. Producing them belongs to the services that define the bytes:
      # this repository is public and self-contained, so it must never need to
      # read a private one to check itself.
      - name: fmt
        working-directory: core
        run: cargo fmt --check
      - name: clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (store sqlite backend)
        working-directory: core
        run: cargo clippy -p store --all-targets --features sqlite -- -D warnings
      - name: clippy (sdk uniffi bindings)
        working-directory: core
        run: cargo clippy -p sdk --all-targets --features uniffi -- -D warnings
      - name: test
        working-directory: core
        run: cargo test --workspace
      - name: test store sqlite feature
        working-directory: core
        run: cargo test -p store --features sqlite
      - name: regenerate uniffi bindings (drift check)
        working-directory: core
        run: |
          cargo build -p sdk --features uniffi
          cargo run -p sdk --features uniffi --bin uniffi-bindgen -- \
            generate --library target/debug/libsdk.so --language kotlin --out-dir crates/sdk/bindings/kotlin
          cargo run -p sdk --features uniffi --bin uniffi-bindgen -- \
            generate --library target/debug/libsdk.so --language swift --out-dir crates/sdk/bindings/swift
          git diff --exit-code -- crates/sdk/bindings
      - name: build tls feature
        working-directory: core
        run: cargo build -p transport --features tls
